version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434" # puerto por defecto
    volumes:
      - ./models:/root/.ollama # persistencia de modelos
    environment:
      - OLLAMA_HOST=0.0.0.0 # acepta conexiones desde fuera del contenedor
    networks:
      - hub_net

networks:
  hub_net:
    external: true
