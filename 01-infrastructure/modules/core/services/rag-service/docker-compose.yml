version: "3.8"

services:
  rag-service:
    build: .
    container_name: rag-service
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
      - ${VAULT_PATH}:/app/vault:ro
    env_file:
      - .env
    environment:
      - VAULT_PATH=/app/vault # Dentro del container siempre es /app/vault
      - DB_PATH=/app/data/vectors.lance
    networks:
      - hub_net
    depends_on:
      - ollama

networks:
  hub_net:
    external: true
