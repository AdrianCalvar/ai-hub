version: "3.8"

services:
  rag-service:
    build: .
    container_name: rag-service
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
      - "${VAULT_PATH}:/app/vault:ro"
    env_file:
      - .env
    environment:
      - VAULT_PATH=/app/vault
      - DB_PATH=/app/data/vectors.lance
      - OLLAMA_HOST=http://ollama:11434
    networks:
      - hub_net
    # Sin depends_on - manejamos el orden en el Taskfile

networks:
  hub_net:
    external: true
