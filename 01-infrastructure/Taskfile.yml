version: "3"

vars:
  OLLAMA_DIR: modules/core/services/ollama
  RAG_DIR: modules/core/services/rag-service

tasks:
  # ============================================
  # SETUP INICIAL
  # ============================================

  setup:rag:
    desc: Instalar dependencias del RAG service
    dir: "{{.RAG_DIR}}"
    cmds:
      - npm install
      - echo "✅ Dependencias instaladas"

  # ============================================
  # DOCKER SERVICES
  # ============================================

  up:
    desc: Levanta todo el hub (Ollama + RAG)
    cmds:
      - docker network create hub_net || true
      - task: up:ollama
      - echo "⏳ Esperando 5s para que Ollama esté listo..."
      - sleep 5
      - task: up:rag

  up:ollama:
    desc: Levanta solo Ollama
    dir: "{{.OLLAMA_DIR}}"
    cmds:
      - docker compose up -d
      - echo "✅ Ollama iniciado"

  up:rag:
    desc: Levanta solo RAG service
    dir: "{{.RAG_DIR}}"
    cmds:
      - docker compose up -d --build
      - echo "✅ RAG service iniciado"

  down:
    desc: Apaga todos los servicios
    cmds:
      - task: down:rag
      - task: down:ollama

  down:ollama:
    desc: Apaga solo Ollama
    dir: "{{.OLLAMA_DIR}}"
    cmds:
      - docker compose down

  down:rag:
    desc: Apaga solo RAG service
    dir: "{{.RAG_DIR}}"
    cmds:
      - docker compose down

  # ============================================
  # DESARROLLO LOCAL (sin Docker)
  # ============================================

  dev:rag:
    desc: Ejecuta RAG service en modo desarrollo (local, sin Docker)
    dir: "{{.RAG_DIR}}"
    cmds:
      - npm run dev

  # ============================================
  # LOGS
  # ============================================

  logs:ollama:
    desc: Ver logs de Ollama
    cmds:
      - docker logs -f ollama

  logs:rag:
    desc: Ver logs de RAG service
    cmds:
      - docker logs -f rag-service

  logs:all:
    desc: Ver logs de todos los servicios
    cmds:
      - docker logs -f ollama &
      - docker logs -f rag-service

  # ============================================
  # HEALTH CHECKS
  # ============================================

  health:
    desc: Verificar salud de todos los servicios
    cmds:
      - echo "🔍 Verificando servicios..."
      - echo ""
      - echo "📡 Ollama:"
      - curl -s http://localhost:11434/api/tags | head -n 5 || echo "❌ Ollama no responde"
      - echo ""
      - echo "📡 RAG Service:"
      - curl -s http://localhost:3000/health | jq || echo "❌ RAG service no responde"
      - echo ""
      - echo "🔍 Deep Health:"
      - curl -s http://localhost:3000/health/deep | jq

  # ============================================
  # MODELOS OLLAMA
  # ============================================

  pull:models:
    desc: Descargar todos los modelos necesarios
    cmds:
      - echo "📥 Descargando modelos..."
      - task: pull:llm
      - task: pull:embed

  pull:llm:
    desc: Descargar modelo LLM (llama3.2:3b)
    dir: "{{.OLLAMA_DIR}}"
    cmds:
      - docker exec -it ollama ollama pull llama3.2:3b

  pull:embed:
    desc: Descargar modelo de embeddings (nomic-embed-text)
    dir: "{{.OLLAMA_DIR}}"
    cmds:
      - docker exec -it ollama ollama pull nomic-embed-text

  list:models:
    desc: Listar modelos instalados
    cmds:
      - docker exec -it ollama ollama list

  # ============================================
  # RAG OPERATIONS (para después)
  # ============================================

  index:
    desc: Re-indexar vault completo
    cmds:
      - curl -X POST http://localhost:3000/index

  query:
    desc: Hacer query al sistema
    cmds:
      - |
        curl -X POST http://localhost:3000/query \
          -H "Content-Type: application/json" \
          -d '{"query": "{{.CLI_ARGS}}"}'

  stats:
    desc: Ver estadísticas del índice
    cmds:
      - curl -s http://localhost:3000/stats | jq

  # ============================================
  # LIMPIEZA
  # ============================================

  clean:
    desc: Limpiar vector DB y rebuild
    dir: "{{.RAG_DIR}}"
    cmds:
      - rm -rf data/*.lance
      - echo "✅ Vector DB limpiada"

  reset:
    desc: Reset completo (down + clean + up)
    cmds:
      - task: down
      - task: clean
      - task: up
